name: Scoring Eval
on:
  workflow_dispatch:
    inputs:
      rescore:
        type: boolean
        default: false
        description: Re-score labelled public inputs with configured model (may incur API costs)
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Evaluate human-labelled samples
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          RESCORE: ${{ inputs.rescore }}
        shell: bash
        run: |
          if [ "$RESCORE" = "true" ]; then
            python evalset.py run
          else
            python evalset.py run --offline
          fi
      - run: cat eval/last_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: scoring-evaluation
          path: eval/last_report.md
